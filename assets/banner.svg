<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.25" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .data-stream {
        stroke-dasharray: 120, 240;
        animation: flow 8s linear infinite;
      }
      .pulse-pill {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      .node-float {
        animation: float 5s ease-in-out infinite alternate;
      }
      @keyframes flow {
        from { stroke-dashoffset: 720; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulse {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.8; transform: scale(1.02); }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />
  <rect width="100%" height="100%" fill="url(#gridPattern)" rx="16" />

  <!-- Dynamic / Animated Background Graphics (Behind Text) -->
  <g opacity="0.35">
    <!-- Flowing data wave lines in background -->
    <path class="data-stream" d="M -50,260 C 200,320 350,180 600,240 C 850,300 1000,190 1250,250" fill="none" stroke="#38bdf8" stroke-width="3" />
    <path class="data-stream" d="M -50,290 C 250,210 450,330 700,260 C 950,200 1100,290 1250,280" fill="none" stroke="#a855f7" stroke-width="2" style="animation-duration: 11s; animation-direction: reverse;" />
    
    <!-- Stylized Grid Table Mockup in Background -->
    <g transform="translate(850, 40) scale(0.75)" opacity="0.4" class="node-float">
      <rect x="0" y="0" width="360" height="220" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" />
      <line x1="0" y1="44" x2="360" y2="44" stroke="#475569" stroke-width="2" />
      <line x1="120" y1="0" x2="120" y2="220" stroke="#334155" stroke-width="1.5" />
      <line x1="240" y1="0" x2="240" y2="220" stroke="#334155" stroke-width="1.5" />
      <line x1="0" y1="88" x2="360" y2="88" stroke="#334155" stroke-width="1" />
      <line x1="0" y1="132" x2="360" y2="132" stroke="#334155" stroke-width="1" />
      <line x1="0" y1="176" x2="360" y2="176" stroke="#334155" stroke-width="1" />
      <!-- Animated highlighting cells -->
      <rect x="124" y="48" width="112" height="36" rx="4" fill="#38bdf8" opacity="0.3" class="pulse-pill" />
      <rect x="4" y="92" width="112" height="36" rx="4" fill="#818cf8" opacity="0.25" class="pulse-pill" style="animation-delay: 1.5s;" />
      <rect x="244" y="136" width="112" height="36" rx="4" fill="#c084fc" opacity="0.3" class="pulse-pill" style="animation-delay: 0.8s;" />
    </g>

    <!-- Glowing ambient nodes -->
    <circle cx="200" cy="70" r="140" fill="#38bdf8" filter="url(#glow)" opacity="0.08" />
    <circle cx="950" cy="180" r="180" fill="#a855f7" filter="url(#glow)" opacity="0.1" />
  </g>

  <!-- Foreground Content: Header, Title, Subtitle, Category Pills -->
  <g id="foreground">
    <!-- Top Meta Tag / Pill -->
    <g transform="translate(60, 48)">
      <rect x="0" y="0" width="220" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="16" cy="15" r="4.5" fill="#38bdf8" />
      <text x="30" y="20" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1">CURATED ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="60" y="128" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Data Grid Components
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="60" y="172" fill="url(#subGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400">
      High-Volume Canvas Tables &#x2022; Spreadsheet Engines &#x2022; Enterprise UI Data Grids
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(60, 218)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="18" y="23" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">&#x26A1; 100M+ Row Canvas</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(196, 0)">
        <rect width="195" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="18" y="23" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">&#x1F4CA; Excel &amp; Formulas</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(407, 0)">
        <rect width="200" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="18" y="23" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">&#x1F3E2; Enterprise &amp; Open Source</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(623, 0)">
        <rect width="190" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
        <text x="18" y="23" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">&#x1F310; React / Vue / Angular</text>
      </g>
    </g>

    <!-- Bottom Accent Line -->
    <line x1="60" y1="285" x2="1140" y2="285" stroke="#334155" stroke-width="1" />
    <text x="60" y="308" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      Updated October 2026 &#x2022; Verified Commercial Pricing &amp; Open Source Benchmarks
    </text>
  </g>
</svg>